services:
  - type: web
    name: aeroshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AEROSHIELD_CORS_ORIGINS
        sync: false
